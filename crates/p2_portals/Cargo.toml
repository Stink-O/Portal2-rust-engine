[package]
name = "p2_portals"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portal 2's portals, portal gun and first-person controller for Bevy + avian3d, in one plugin group."
license = "MIT"

[dependencies]
bevy = { workspace = true }
p2_core = { path = "../p2_core" }
p2_assets = { path = "../p2_assets" }
p2_movement = { path = "../p2_movement" }
p2_view = { path = "../p2_view" }
p2_gun = { path = "../p2_gun" }
p2_render = { path = "../p2_render" }
p2_fx = { path = "../p2_fx" }
p2_transit = { path = "../p2_transit" }
p2_body = { path = "../p2_body" }
